name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m playwright install --with-deps chromium
      # Ubuntu 24.04 runners block the unprivileged user namespaces Chromium's sandbox needs,
      # so the browser proof could not launch and every XSS replay came back inconclusive.
      # The scanner keeps chromium_sandbox=True; this only lets the runner provide it.
      - name: Allow the Chromium sandbox on the runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: python -m pytest -q --run-practice
      - run: python -m ruff check src tests
