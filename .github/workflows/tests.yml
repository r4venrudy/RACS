name: Tests
on: [push, pull_request]
permissions:
  contents: read
# Replace stale PR checks; keep push, release, and manual runs independent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m playwright install --with-deps chromium
      # Ubuntu 24.04 runners block the unprivileged user namespaces Chromium's sandbox needs,
      # so the browser proof could not launch and every XSS replay came back inconclusive.
      # The scanner keeps chromium_sandbox=True; this only lets the runner provide it.
      - name: Allow the Chromium sandbox on the runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: python -m pytest -q --run-practice
      - run: python -m ruff check src tests
